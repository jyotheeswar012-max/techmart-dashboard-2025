# TechMart Data Pipeline — GitHub Actions
# Runs daily at 06:00 UTC and on every push to main that touches pipeline/
# Outputs (market_context.csv, kpi_summary.json, etc.) are committed back
# to the data/ branch so the dashboard always has fresh context data.

name: Daily Data Pipeline

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC every day
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:             # allow manual trigger from Actions tab

jobs:
  run-pipeline:
    name: Fetch · Transform · Export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write            # needed to commit output files back

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Run pipeline ────────────────────────────────────────────────────
      - name: Run TechMart pipeline
        env:
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}   # optional — set in repo Secrets
        run: python pipeline/fetch_data.py --period 1mo

      # ── 5. Commit outputs ──────────────────────────────────────────────────
      - name: Commit pipeline outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore(pipeline): auto-update data [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Upload artifacts (30-day retention) ─────────────────────────────
      - name: Upload pipeline outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn
